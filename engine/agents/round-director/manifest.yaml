schema_version: "0.1.0"
name: round-director
version: "0.1.0"
description: Selects bounded research rounds from graph state using portfolio search and explicit budgets.
instruction: AGENT.md
capabilities:
  - schedule.portfolio
  - schedule.branch
  - schedule.stop
tools: []
side_effects:
  - none
budgets:
  max_turns: 6
  max_tool_calls: 8
  max_wall_seconds: 300
contracts:
  input: contracts/input.schema.json
  output: contracts/output.schema.json
skills:
  - skills/portfolio-search/SKILL.md
child_agents: []
runtime_requirements: []

